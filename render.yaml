services:
  - type: worker
    name: telegram-crypto-signal-bot
    runtime: python
    plan: starter
    buildCommand: pip install -r requirements.txt
    startCommand: python main.py
    disk:
      name: signal-bot-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_CHAT_ID
        sync: false
      - key: SCAN_INTERVAL_SECONDS
        value: "60"
      - key: SCANNER_ENABLED
        value: "true"
      - key: USE_TREND_FILTER
        value: "false"
      - key: USE_SMA200_FILTER
        value: "false"
      - key: USE_BREAK_EVEN
        value: "true"
      - key: USE_TRAILING_STOP
        value: "true"
      - key: TIMEFRAME
        value: 15m
      - key: DATA_DIR
        value: /var/data
